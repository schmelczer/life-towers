name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build and publish image
        uses: https://git.schmelczer.dev/andras/ci-actions/docker-publish@a415e2a50992af99b7b6dd3f02cca372d87b11f6
        with:
          context: .
          # The published image is deployed at https://schmelczer.dev/towers/,
          # so the SPA is built with that sub-path baked into <base href> and
          # the service-worker manifest. Change this if the deploy path changes.
          build-args: |
            BASE_HREF=/towers/
          token: ${{ secrets.FORGEJO_PACKAGE_TOKEN }}
    if: ${{ github.actor != 'renovate-bot' && !startsWith(github.ref, 'refs/heads/renovate/') && !startsWith(github.head_ref, 'renovate/') }}
